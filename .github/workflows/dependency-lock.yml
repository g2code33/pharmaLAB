name: Bootstrap missing desktop lockfile
on: pull_request
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-desktop-lock
          path: src-tauri/Cargo.lock
          if-no-files-found: error
      # Temporary transport of public lock data for restricted development hosts.
      - run: |
          gzip -nc src-tauri/Cargo.lock | base64 -w0 | fold -w 3500 | awk '{print "::notice title=lock-" NR "::" $0}'
      - run: gzip -nc src-tauri/Cargo.lock | base64 -w0 | fold -w 3500 | awk 'NR>10 {print "::notice title=lock-" NR "::" $0}'
