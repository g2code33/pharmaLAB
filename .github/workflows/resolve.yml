name: Review patched SQLite dependency graph
on:
  pull_request:
    paths: ['.github/workflows/resolve.yml']
permissions: {contents: read}
jobs:
  resolve:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: |
          sed -i 's/^tauri-plugin-sql=.*/rusqlite={version="=0.43.0",features=["bundled"]}/' src-tauri/Cargo.toml
          cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 > /dev/null
          gzip -nc src-tauri/Cargo.lock | base64 -w0 | fold -w 3500 > "$RUNNER_TEMP/lock-chunks"
          awk 'NR<=10 {print "::notice title=lock-" NR "::" $0}' "$RUNNER_TEMP/lock-chunks"
      - run: awk 'NR>10 {print "::notice title=lock-" NR "::" $0}' "$RUNNER_TEMP/lock-chunks"
      - uses: actions/upload-artifact@v4
        with: {name: patched-lock, path: src-tauri/Cargo.lock, if-no-files-found: error}
